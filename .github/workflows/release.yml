name: Publish Windows release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build EXE
        shell: powershell
        run: .\build.ps1
      - name: Verify before release
        shell: powershell
        run: .\smoke.ps1
      - name: Publish v0.1.6
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v0.1.6 --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "v0.1.6 already published; leaving existing release unchanged."
            exit 0
          }
          gh release create v0.1.6 "./src/Builder/bin/Release/DK-Self-Extractor-Builder.exe" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "v0.1.6" --notes "Show a visible interactive CMD or PowerShell console while post-extraction commands execute; wait for completion and preserve exit-code handling. No changes to SFX package format or other functionality."
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release publication failed." }
